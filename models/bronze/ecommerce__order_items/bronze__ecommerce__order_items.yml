version: 2

models:
  - name: bronze__ecommerce__order_items
    description: >
      Bronze layer. Ecommerce order items.

    columns:
      - name: id
        description: Unique order item identifier
        tests:
          - not_null
          - unique

      - name: order_id
        description: Unique order identifier

      - name: user_id
        description: Unique user identifier

      - name: product_id
        description: Unique product identifier

      - name: status
        description: Order item status

      - name: created_at
        description: Order item placement date and time

      - name: shipped_at
        description: Order item shipment date and time

      - name: delivered_at
        description: Order item delivery date and time

      - name: returned_at
        description: Order item return date and time

      - name: sale_price
        description: Selling price

      - name: _loaded_at
        description: Date and time of loading into bronze layer