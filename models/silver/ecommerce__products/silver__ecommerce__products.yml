version: 2

models:
  - name: silver__ecommerce__products
    description: >
      Silver layer. Ecommerce products.

    columns:
      - name: id
        description: Unique product identifier

      - name: cost
        description: Cost of production or procurement of product

      - name: category
        description: Product category

      - name: name
        description: Product name

      - name: brand
        description: Brand name

      - name: retail_price
        description: Retail price of product

      - name: profit
        description: Profit from sales
        tests:
          - min_value:
              arguments:
                min_value: 0

      - name: department
        description: Targeted department

      - name: sku
        description: Warehouse identifier of product
        tests:
          - is_valid_sku_length:
              arguments:
                required_length: 32
        

      - name: distribution_center_id
        description: Warehouse center identifier

      - name: distribution_center_name
        description: Warehouse center name

      - name: _loaded_at
        description: Date and time of loading into silver layer

      - name: _source
        description: Data source